<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colibri — a tiny bird's-eye view</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/colibri.png">
<style>
  :root {
    --bg: #0d1418;
    --panel: rgba(13, 20, 24, 0.92);
    --line: #23323a;
    --text: #c9d6dc;
    --muted: #7c8f99;
    --accent: #3ddc97;
    --asset: #2ec4b6;
    --attribute: #ffbf69;
    --relation: #c77dff;
    --root: #ff5d8f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
               font: 14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  #graph { width: 100vw; height: 100vh; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    backdrop-filter: blur(6px);
  }
  header img { width: 34px; height: 34px; filter: invert(1) brightness(1.2); }
  header .title { font-size: 17px; font-weight: 600; letter-spacing: 0.3px; }
  header .title em { color: var(--accent); font-style: normal; }
  header .sub { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .controls input {
    background: #101c22; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 10px; width: 230px; outline: none;
  }
  .controls input:focus { border-color: var(--accent); }
  .controls button {
    background: #101c22; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 12px; cursor: pointer; font-size: 13px;
  }
  .controls button.active { border-color: var(--accent); color: var(--accent); }
  .steppers { display: flex; gap: 4px; align-items: center; margin-left: 6px; }
  .steppers .label { color: var(--muted); font-size: 11.5px; margin: 0 2px 0 6px; }
  .steppers button { padding: 7px 9px; }

  #legend {
    position: fixed; left: 12px; bottom: 12px; z-index: 10;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px; font-size: 12.5px; line-height: 1.9;
  }
  #legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; }

  #panel {
    position: fixed; top: 64px; right: 12px; width: 380px; max-height: calc(100vh - 90px);
    overflow-y: auto; z-index: 10; display: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px;
  }
  #panel.visible { display: block; }
  #panel .kind { font-size: 11.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  #panel h2 { margin: 2px 0 8px; font-size: 18px; color: #fff; }
  #panel .prov { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  #panel .desc { color: var(--text); font-size: 13px; margin-bottom: 12px; }
  #panel .section { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; font-size: 13px; }
  #panel .section h3 { margin: 0 0 6px; font-size: 11.5px; text-transform: uppercase;
                       letter-spacing: 1px; color: var(--muted); }
  #panel .chip {
    display: inline-block; background: #101c22; border: 1px solid var(--line);
    border-radius: 12px; padding: 2px 10px; margin: 2px 4px 2px 0; cursor: pointer; font-size: 12.5px;
  }
  #panel .chip:hover { border-color: var(--accent); color: var(--accent); }
  #panel .path .crumb { cursor: pointer; }
  #panel .path .crumb:hover { color: var(--accent); }
  #panel .path .sep { color: var(--muted); padding: 0 4px; }
  #panel .actions { display: flex; gap: 8px; margin-top: 14px; }
  #panel .actions button { flex: 1; }

  #hint {
    position: fixed; right: 12px; bottom: 12px; z-index: 10; color: var(--muted); font-size: 11.5px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px;
  }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             color: var(--muted); z-index: 20; font-size: 15px; }
</style>
</head>
<body>
<div id="graph"></div>
<div id="loading">loading the operating model...</div>

<header>
  <img src="assets/colibri-outline.png" alt="Colibri">
  <div>
    <div class="title">Colibri <em>&mdash;</em> a tiny bird's-eye view</div>
    <div class="sub">z-axis = hierarchy strata &middot; hover to identify &middot; click to inspect</div>
  </div>
  <div class="controls">
    <input id="search" type="text" list="node-names" placeholder="search a type... (Enter)" autocomplete="off">
    <datalist id="node-names"></datalist>
    <button id="mode-free" class="active">Free</button>
    <button id="mode-strata">Strata</button>
    <button id="mode-onion" title="containment clusters: store at the center, graphs around it, entities innermost">Onion</button>
    <div class="steppers">
      <span class="label">size</span>
      <button id="size-down" title="smaller nodes">&minus;</button>
      <button id="size-up" title="bigger nodes">+</button>
      <span class="label">space</span>
      <button id="space-down" title="shorter links">&minus;</button>
      <button id="space-up" title="longer links">+</button>
    </div>
    <button id="toggle-particles" class="active" title="flowing dots along links">Motion</button>
  </div>
</header>

<div id="legend"></div>

<div id="panel"></div>

<div id="hint">drag: rotate &middot; scroll: zoom &middot; right-drag: pan &middot; click background: clear</div>

<script src="https://unpkg.com/3d-force-graph"></script>
<script src="app.js"></script>
</body>
</html>
