<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pyntology lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/colibri.png">
<style>
  :root {
    --bg: #0d1418; --panel: rgba(13, 20, 24, 0.92); --line: #23323a;
    --text: #c9d6dc; --muted: #7c8f99; --accent: #3ddc97;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg);
               color: var(--text); font: 14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header img { width: 30px; height: 30px; filter: invert(1) brightness(1.2); }
  header .title { font-size: 16px; font-weight: 600; }
  header .title em { color: var(--accent); font-style: normal; }
  header .sub { color: var(--muted); font-size: 12px; margin-left: auto; }
  #panel {
    position: fixed; top: 62px; right: 12px; width: 340px; max-height: calc(100vh - 200px);
    overflow-y: auto; z-index: 10; display: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
  }
  #panel.visible { display: block; }
  #panel .kind { font-size: 11.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  #panel h2 { margin: 2px 0 8px; font-size: 17px; color: #fff; }
  #panel .desc { font-size: 13px; margin-bottom: 10px; }
  #panel .fact { font: 12.5px/1.6 "SF Mono", Menlo, Consolas, monospace; background: #101c22;
                 border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 6px 0; }
  #caption {
    position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%);
    z-index: 10; max-width: 72vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 14px; font-size: 12.5px; color: var(--text);
  }
  #caption code { color: var(--accent); font: 12.5px "SF Mono", Menlo, Consolas, monospace; }
  #timeline {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--line);
  }
  #play {
    background: #101c22; color: var(--accent); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 16px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  #play:hover { border-color: var(--accent); }
  #scrub { flex: 1; accent-color: var(--accent); cursor: pointer; }
  #counter { color: var(--muted); font-size: 12px; min-width: 72px; text-align: right; }
  #hint {
    position: fixed; left: 12px; bottom: 64px; z-index: 10; color: var(--muted); font-size: 11.5px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px;
  }
  #tooltip {
    position: fixed; z-index: 20; pointer-events: none; display: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 9px; font-size: 12.5px;
  }
</style>
</head>
<body>
<header>
  <img src="assets/colibri-outline.png" alt="Pyntology">
  <div class="title">Pyntology <em>&mdash;</em> the lab</div>
  <div class="sub" id="lesson-name">lesson</div>
</header>
<div id="panel"></div>
<div id="tooltip"></div>
<div id="caption">&nbsp;</div>
<div id="timeline">
  <button id="play" type="button">Play</button>
  <input id="scrub" type="range" min="0" max="0" value="0" step="1">
  <div id="counter">0 / 0</div>
</div>
<div id="hint">drag: orbit &middot; right-drag: pan &middot; scroll: zoom &middot; click matter to inspect it</div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="lab.js"></script>
</body>
</html>
